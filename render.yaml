# Render Blueprint: https://render.com/docs/blueprint-spec
# After connecting this repo, use "Apply render.yaml" or create a Web Service with Root Directory = server.

services:
  - type: web
    name: mushroom-nursery-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set a secret in the Render Dashboard (ESP32 + app send header X-API-Key).
      - key: API_KEY
        sync: false
      # Brevo SMTP for breach emails. Fill these in the Render Dashboard.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
